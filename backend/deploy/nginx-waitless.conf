# nginx in front of the WaitLess API: answers on port 80 (plain http://) and
# passes each request to gunicorn on 127.0.0.1:8000. It also serves the admin
# site's CSS and JavaScript from backend/staticfiles. Install it with
# (see DEPLOY.md, step 10):
#   sudo cp deploy/nginx-waitless.conf /etc/nginx/sites-available/waitless
#   sudo ln -sf /etc/nginx/sites-available/waitless /etc/nginx/sites-enabled/waitless
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Profile photos can be up to 10 MB (accounts/photos.py). nginx's own
    # limit is 1 MB, which would refuse most phone photos.
    client_max_body_size 12M;

    location /static/ {
        alias /home/ubuntu/waitless/backend/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
